<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manou Dev — Développeuse Web Frontend & Web Designer</title>
    <meta
      name="description"
      content="Portfolio de Manou Dev, développeuse web frontend et web designer : interfaces, sites, applications mobiles et design."
    />
    <!-- Aperçu des liens partagés (WhatsApp, LinkedIn, Facebook, X…). L'image doit rester en PNG : ces services n'affichent pas le SVG. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Manou Dev" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Manou Dev — Développeuse Web Frontend & Web Designer" />
    <meta
      property="og:description"
      content="Portfolio de Manou Dev, développeuse web frontend et web designer : interfaces, sites, applications mobiles et design."
    />
    <meta property="og:url" content="https://porfolio-manou-dev.vercel.app/" />
    <meta property="og:image" content="https://porfolio-manou-dev.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo de Manou Dev" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Manou Dev — Développeuse Web Frontend & Web Designer" />
    <meta
      name="twitter:description"
      content="Portfolio de Manou Dev, développeuse web frontend et web designer : interfaces, sites, applications mobiles et design."
    />
    <meta name="twitter:image" content="https://porfolio-manou-dev.vercel.app/og-image.png" />
    <meta name="theme-color" content="#f3eee5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14120f" media="(prefers-color-scheme: dark)" />
    <script>
      // Applique le thème avant le premier rendu pour éviter tout flash.
      try {
        var t = localStorage.getItem('manou-theme')
        var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
